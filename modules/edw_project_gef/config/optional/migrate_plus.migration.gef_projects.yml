langcode: en
status: true
dependencies: {  }
id: gef_projects
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: null
migration_group: default
label: null
source:
  plugin: gef_projects
  url: 'https://www.thegef.org/projects-operations/database/export/json'
  urls: 'https://www.thegef.org/projects-operations/database/export/json'
  item_selector: 0
  translated_fields:
    title: title
    body: body
  fields:
    -
      name: field_original_id
      selector: GEFProjectID
    -
      name: title
      selector: ProjectName
    -
      name: field_countries
      selector: field_country_code
    -
      name: body
      selector: projectDescription
    -
      name: field_project_phase
      selector: LatestTimelineStatus
    -
      name: field_project_status
      selector: LatestTimelineStatus
    -
      name: field_project_implementing_orgs
      selector: implAgencies
    -
      name: field_executing_agencies
      selector: ExecutingAgencies
    -
      name: field_trust_fund
      selector: trustFundName
    -
      name: field_gef_project_phase
      selector: GEFPhase
    -
      name: field_project_type
      selector: projectType
    -
      name: field_gef_project_type
      selector: projectType
    -
      name: field_topics
      selector: focalAreas
    -
      name: field_gef_project_grant
      selector: GEFAmountLatest
    -
      name: field_gef_cofinancing
      selector: CofinAmountLatest
    -
      name: field_date
      selector: ApprovalFY
    -
      name: field_project_approved_date
      selector: ApprovalFY
  ids:
    field_original_id:
      type: string
process:
  field_original_id: field_original_id
  title: title
  field_countries:
    plugin: entity_lookup
    source: field_countries
    entity_type: taxonomy_term
    bundle_key: vid
    bundle: countries
    value_key: field_iso_2l
    ignore_case: true
    strict: false
  field_project_mechanism:
    -
      plugin: default_value
      default_value: GEF
  body: body
  field_link/uri: field_url
  field_project_phase: field_project_phase
  field_project_implementing_orgs:
    plugin: entity_lookup
    source: field_project_implementing_orgs
    entity_type: taxonomy_term
    bundle_key: vid
    bundle: organizations
    value_key: name
    ignore_case: true
    strict: false
  field_executing_agencies: field_executing_agencies
  field_trust_fund: field_trust_fund
  field_gef_project_phase: field_gef_project_phase
  field_gef_project_type:
    - plugin: null_coalesce
      source:
        - field_gef_project_type
        - field_project_type
    - plugin: callback
      callable: trim
    - plugin: static_map
      map:
        "Medium-size Project": medium-size
        "Full-size Project": full-size
        "PFD": pfd
        "Enabling Activity": enabling-activity
        "GBFF": gbff
      bypass: true
  field_topics:
    -
      plugin: static_map
      source: field_topics
      map:
        Biodiversity: 'Biological diversity'
        'Chemicals and Waste': 'Chemicals and Waste'
        'Climate Change': 'Climate and Atmosphere'
        'International Waters': 'Marine and Freshwater'
        'Land Degradation': 'Land and Agriculture'
        'Ozone Depleting Substances': 'Climate and Atmosphere'
        POPs: 'Chemicals and Waste'
        'Multi Focal Area': __UNMAPPED__
      default_value: __UNMAPPED__
    -
      plugin: entity_lookup
      value_key: name
      bundle_key: vid
      bundle: topics
      entity_type: taxonomy_term
      ignore_case: true
  field_gef_project_grant: field_gef_project_grant
  field_gef_cofinancing: field_gef_cofinancing
  field_project_approved_date: field_date
  translated_values: translated_values
destination:
  plugin: 'entity:node'
  default_bundle: project
  translations: true
migration_dependencies: {  }
