langcode: en
status: true
dependencies:
  config:
    - field.storage.node.field_date
    - field.storage.node.field_countries
    - field.storage.node.body
    - field.storage.node.field_executing_agencies
    - field.storage.node.field_url
    - field.storage.node.field_implementing_agencies
    - field.storage.node.field_project_phase
    - field.storage.node.field_project_status
    - field.storage.node.field_topics
    - field.storage.node.field_treaty
    - field.storage.node.field_trust_fund
    - field.storage.node.field_project_type
    - search_api.server.solr
    - core.entity_view_mode.node.teaser
  module:
    - search_api_solr
    - node
    - search_api
    - search_api_attachments
third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 3
      fuzzy: 1
      fuzzy_analyzer: true
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: true
      use_language_undefined_as_fallback_language: false
      specific_languages:
        en: '0'
        fr: '0'
        ru: '0'
        es: '0'
        zh-hans: '0'
        ar: '0'
      use_universal_collation: false
id: projects
name: Projects
description: ''
read_only: false
field_settings:
  aggregated_date:
    label: 'Aggregated date'
    property_path: aggregated_field
    type: date
    configuration:
      type: union
      fields:
        - 'entity:node/field_date'
  aggregated_field:
    label: 'Aggregated field'
    property_path: aggregated_field
    type: string
    configuration:
      type: union
      fields:
        - 'entity:node/field_date'
  body:
    label: Description
    datasource_id: 'entity:node'
    property_path: body
    type: text
    boost: 2.0
    dependencies:
      config:
        - field.storage.node.body
  field_countries:
    label: Countries
    datasource_id: 'entity:node'
    property_path: field_countries
    type: integer
    dependencies:
      config:
        - field.storage.node.field_countries
  field_date:
    label: 'Approval fiscal year'
    datasource_id: 'entity:node'
    property_path: field_date
    type: date
    dependencies:
      config:
        - field.storage.node.field_date
  field_executing_agencies:
    label: 'Executing agencies'
    datasource_id: 'entity:node'
    property_path: field_executing_agencies
    type: string
    dependencies:
      config:
        - field.storage.node.field_executing_agencies
  field_implementing_agencies:
    label: 'Implementing agencies'
    datasource_id: 'entity:node'
    property_path: field_implementing_agencies
    type: string
    dependencies:
      config:
        - field.storage.node.field_implementing_agencies
  field_project_phase:
    label: Phase
    datasource_id: 'entity:node'
    property_path: field_project_phase
    type: string
    dependencies:
      config:
        - field.storage.node.field_project_phase
  field_project_status:
    label: Status
    datasource_id: 'entity:node'
    property_path: field_project_status
    type: string
    dependencies:
      config:
        - field.storage.node.field_project_status
  field_project_type:
    label: Type
    datasource_id: 'entity:node'
    property_path: field_project_type
    type: string
    dependencies:
      config:
        - field.storage.node.field_project_type
  field_topics:
    label: Topics
    datasource_id: 'entity:node'
    property_path: field_topics
    type: integer
    dependencies:
      config:
        - field.storage.node.field_topics
  field_treaty:
    label: Treaty
    datasource_id: 'entity:node'
    property_path: field_treaty
    type: integer
    dependencies:
      config:
        - field.storage.node.field_treaty
  field_trust_fund:
    label: 'Trust fund'
    datasource_id: 'entity:node'
    property_path: field_trust_fund
    type: string
    dependencies:
      config:
        - field.storage.node.field_trust_fund
  field_url:
    label: 'GEF Link'
    datasource_id: 'entity:node'
    property_path: field_url
    type: string
    dependencies:
      config:
        - field.storage.node.field_url
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: text
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:node':
          project: teaser
  status:
    label: Published
    datasource_id: 'entity:node'
    property_path: status
    type: boolean
    dependencies:
      module:
        - node
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: 3.0
    dependencies:
      module:
        - node
  url:
    label: URI
    property_path: search_api_url
    type: string
    configuration:
      absolute: true
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - project
    languages:
      default: false
      selected:
        - en
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  auto_aggregated_fulltext_field: {  }
  custom_value: {  }
  double_quote_workaround:
    weights:
      postprocess_query: 0
      preprocess_index: -15
      preprocess_query: -15
    all_fields: true
    fields:
      - aggregated_field
      - field_executing_agencies
      - field_focal_areas
      - field_implementing_agencies
      - field_project_phase
      - field_project_status
      - field_project_type
      - field_trust_fund
    replacement: '|9999999998|'
  entity_status: {  }
  entity_type: {  }
  file_attachments:
    excluded_extensions: 'aif art avi bmp gif ico mov oga ogv png psd ra ram rgb flv'
    number_indexed: 0
    number_first_bytes: '1 MB'
    max_filesize: '0'
    excluded_private: 1
    excluded_mimes: 'audio/x-aiff image/x-jg video/x-msvideo image/x-ms-bmp image/gif image/vnd.microsoft.icon video/quicktime audio/ogg video/ogg image/png image/x-photoshop audio/x-realaudio audio/x-pn-realaudio image/x-rgb video/x-flv'
  highlight:
    weights:
      postprocess_query: 0
    prefix: '<strong>'
    suffix: '</strong>'
    excerpt: true
    excerpt_always: false
    excerpt_length: 256
    exclude_fields: {  }
    highlight: always
    highlight_partial: false
  html_filter:
    weights:
      preprocess_index: -15
      preprocess_query: -15
    all_fields: true
    fields:
      - aggregated_field
      - body
      - field_executing_agencies
      - field_implementing_agencies
      - field_project_phase
      - field_project_status
      - field_project_type
      - field_trust_fund
      - field_url
      - rendered_item
      - title
      - url
    title: true
    alt: true
    tags:
      b: 2
      h1: 5
      h2: 3
      h3: 2
      strong: 2
  language_with_fallback: {  }
  rendered_item: {  }
  solr_date_range:
    weights:
      preprocess_index: 0
  type_boost:
    weights:
      preprocess_index: 0
    boosts:
      'entity:node':
        datasource_boost: 1.0
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  index_directly: true
  track_changes_in_references: true
server: solr
